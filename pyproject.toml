[project]
name = "spinoza-rag"
version = "0.1.0"
description = "Local retrieval-augmented exploration of Deleuze's lectures on Spinoza"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9,<2",
    "langchain-text-splitters>=1.1.3,<2",
    "pypdf>=7,<8",
    "tokenizers>=0.22.2,<0.23",
]

[build-system]
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
constraint-dependencies = ["onnxruntime<1.21; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
required-version = ">=0.12.1,<0.13"

[tool.commitizen]
name = "cz_conventional_commits"
message_length_limit = 72

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",  # Import errors
    "E7",  # Syntax and statement conventions
    "E9",  # Runtime and syntax errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "UP",  # Modern Python syntax
    "B",   # Common bug patterns
    "D",   # Docstring conventions
]
ignore = [
    "D104",  # Package __init__.py files may omit docstrings
    "D107",  # Do not require __init__ method docstrings
    "D417",  # Do not repeat every argument in docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
