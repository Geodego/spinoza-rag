default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]

  - repo: local
    hooks:
      # Check-only replacements for the built-in whitespace fixers, which
      # rewrite files. Markdown may keep trailing spaces as hard line breaks.
      - id: trailing-whitespace
        name: Check trailing whitespace
        entry: '[ \t]+$'
        language: pygrep
        types: [text]
        exclude: \.md$

      - id: final-newline
        name: Check single final newline
        entry: '[^\n]\Z|\n\n\Z'
        args: [--multiline]
        language: pygrep
        types: [text]

      - id: conventional-commits
        name: Validate commit message
        entry: uv run --locked cz check --message-length-limit 72 --commit-msg-file
        language: system
        stages: [commit-msg]

      - id: ruff-lint
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, jupyter, toml]
        files: (\.pyi?$|\.ipynb$|(^|/)(pyproject|ruff)\.toml$)
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi, jupyter, toml]
        files: (\.pyi?$|\.ipynb$|(^|/)(pyproject|ruff)\.toml$)
        require_serial: true

      - id: check-docs
        name: Check Markdown links and README length
        entry: uv run --locked python -I scripts/check_docs.py
        language: system
        # A renamed page breaks links in unchanged files, so scan them all.
        pass_filenames: false
        files: \.md$

      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        # mypy checks the configured files as a whole, not staged files.
        pass_filenames: false
        files: (\.pyi?$|(^|/)pyproject\.toml$|(^|/)uv\.lock$)
        require_serial: true
