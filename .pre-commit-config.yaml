default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]

  - repo: local
    hooks:
      - id: conventional-commits
        name: Validate commit message
        entry: uv run --locked cz check --message-length-limit 72 --commit-msg-file
        language: system
        stages: [commit-msg]

      - id: ruff-lint
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, jupyter, toml]
        files: (\.pyi?$|\.ipynb$|(^|/)(pyproject|ruff)\.toml$)
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi, jupyter, toml]
        files: (\.pyi?$|\.ipynb$|(^|/)(pyproject|ruff)\.toml$)
        require_serial: true
