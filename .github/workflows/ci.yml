name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Install locked dependencies and package
        run: uv sync --locked --no-editable
      - name: Lint
        run: uv run --locked --no-editable ruff check .
      - name: Check formatting
        run: uv run --locked --no-editable ruff format --check .
      - name: Test installed package
        run: uv run --locked --no-editable pytest
      - name: Check repository hygiene
        run: uv run --locked prek run --all-files
      - name: Build source distribution and wheel
        run: uv build --no-sources
